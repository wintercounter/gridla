name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  static:
    name: Format, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bunx tsc --noEmit -p examples/tsconfig.json
      - run: bun run scripts/check-wording.ts

  unit:
    name: Unit, compatibility, invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage packages tests/unit tests/compatibility tests/invariants tests/react tests/interaction
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 7

  package:
    name: Package contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run test:package
      - run: bun run build
      - run: bun run check:size
      - run: bun run check:api
      - uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: packages/gridla/dist
          retention-days: 7

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run benchmarks/run.ts --check --tolerance 4 --json bench-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results.json
          retention-days: 30

  site:
    name: Build site, gallery, studio, adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run scripts/build-site.ts
      - run: bun run --filter gridla-website check-links
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site-dist
          retention-days: 7

  browser:
    name: Browser tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [site]
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site-dist
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps ${{ matrix.project }} ffmpeg
      - run: bunx playwright test --project=${{ matrix.project }}
        env:
          GRIDLA_SITE_DIR: site-dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  obscura:
    name: Browser tests (obscura CDP lane)
    runs-on: ubuntu-latest
    needs: [site]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site-dist
      - run: bun run tests/e2e/obscura/install.ts
      - run: bunx playwright install ffmpeg
      - run: bunx playwright test --project=obscura
        env:
          GRIDLA_SITE_DIR: site-dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-obscura
          path: |
            playwright-report
            test-results
          retention-days: 7

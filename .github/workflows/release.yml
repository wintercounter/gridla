name: Release

# Opens a version PR from pending changesets. Publishing is manual.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:package
      - name: Open or update the release PR
        uses: changesets/action@v1
        with:
          version: bun run version
          commit: 'chore: release'
          title: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Publishing to npm is done manually by the maintainer after merging the
      # release PR: `bun run build && cd packages/gridla && npm publish`.
      # `scripts/verify-published.ts` checks the published version afterwards.

  dry-run:
    name: Dry-run package (pull requests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: cd packages/gridla && npm publish --dry-run --provenance=false

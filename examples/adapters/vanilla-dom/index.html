<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gridla · DOM adapter</title>
  </head>
  <body>
    <main class="page">
      <header class="page-head">
        <div>
          <h1>Gridla with the DOM</h1>
          <p>
            A framework-free canvas. The layout is projected onto the measured stage with
            <code>projectLayout</code> and every item is positioned with a transform. This app
            drives the shared adapter contract tests; it emits the same
            <code>data-gridla-*</code> attributes every adapter does.
          </p>
        </div>
      </header>
      <section class="gd-stage" id="stage">
        <div id="canvas" data-gridla-canvas></div>
      </section>
      <p class="page-note" id="note"></p>
    </main>
  </body>
</html>
